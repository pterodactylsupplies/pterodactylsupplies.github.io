<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404</title>
  <meta name="robots" content="noindex">

  <!-- GitHub Pages serves this file for any missing path anywhere on the
       site, however deep. It hands the reader to the gallery’s own 404: the
       page for the number 404, which has no cell on the grid but is a real
       page with real pictures on it.

       This used to hold The Pillar Radio, which was the same document as
       thepillar.html plus a <base href="/"> so its relative asset paths
       survived being served at a deep path. That page is unaffected and
       still lives at /thepillar.html, linked from the homepage.

       Everything below is absolute or inline, so no <base> is needed. -->
  <link rel="canonical" href="https://pterodactylsupplies.github.io/numbers/#/404">

  <style>
    /* DD Grotesk by Keith DD — dypedaces.com. Absolute path, because this
       file is served for missing addresses at any depth. */
    @font-face {
      font-family: "DD Grotesk";
      src: url("/numbers/fonts/dd-grotesk.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --ink: #000000;
      --link: #0000ee;
      --bg: #ffffff;
      --dot: rgba(0, 0, 0, 0.22);
    }

    /* matches the gallery, which turns over with the system when nothing
       has been chosen */
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #cfcfcf;
        --link: #8ab4ff;
        --bg: #000000;
        --dot: rgba(255, 255, 255, 0.16);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: "DD Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
    }

    a { color: var(--link); }

    .n {
      display: block;
      font-family: "DD Grotesk", "Helvetica Neue", Arial, sans-serif;
      font-size: 72px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <p>
    <span class="n">404</span>
    <a href="/numbers/#/404">Give or Take 404</a>
  </p>
  <script>location.replace("/numbers/#/404");</script>
</body>
</html>
