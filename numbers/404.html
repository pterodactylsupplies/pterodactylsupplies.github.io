<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404</title>
  <meta name="robots" content="noindex">
  <!-- The gallery's own not-found page. The site root has its own 404.html
       (The Pillar Radio) which GitHub Pages serves for the rest of the site;
       this one exists so a missing address under /numbers/ lands among the
       numbers instead. It hands the reader to #/404 — the page for the
       number 404, which has no cell on the grid but is a real page with
       real pictures on it. -->
  <link rel="canonical" href="https://pterodactylsupplies.github.io/numbers/#/404">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      background-image: radial-gradient(rgba(0, 0, 0, 0.22) 1px, transparent 1px);
      background-size: 16px 16px;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      text-align: center;
    }
    a { color: #0000ee; }
    .n {
      display: block;
      font-family: "Courier New", monospace;
      font-size: 64px;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <p>
    <span class="n">404</span>
    <a href="/numbers/#/404">Give or Take 404</a>
  </p>
  <script>location.replace("/numbers/#/404");</script>
</body>
</html>
